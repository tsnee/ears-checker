schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

context: |
  Scala 3.10 with Mill, strongly typed functional style; pure core, effects at the edges.
  A pure EARS classifier library for the JVM and Scala.js, plus the ears-check command line (ZIO).
  Examples and test fixtures use generic domains. See CLAUDE.md.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  specs:
    - >-
      Write every requirement statement in strict EARS form, using exactly one of these
      templates, with SHALL in uppercase (OpenSpec's validator requires it):
      Ubiquitous "The <system> SHALL <response>.";
      Event-driven "When <trigger>, the <system> SHALL <response>.";
      State-driven "While <precondition>, the <system> SHALL <response>.";
      Unwanted behavior "If <trigger>, then the <system> SHALL <response>.";
      Optional feature "Where <feature is included>, the <system> SHALL <response>.";
      Complex: "While <precondition>, when <trigger>, the <system> SHALL <response>."
      (keyword order Where, While, When/If).
    - >-
      One requirement states one response: exactly one SHALL per statement, no "and"-joined
      responses, no MUST, no SHOULD or MAY, and no other modal verbs. Split compound
      requirements into separate ones.
    - >-
      Name the system consistently (one noun phrase per capability), and write triggers and
      preconditions as observable conditions, not implementation steps.
    - >-
      Scenarios (WHEN/THEN) illustrate a requirement with concrete values; they never add
      behavior the EARS statement doesn't already require.
  proposal:
    - >-
      Any requirement-like sentence in a proposal is a summary; the normative EARS statements
      live in the spec deltas.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
