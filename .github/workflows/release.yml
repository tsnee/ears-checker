# Releases a version to Maven Central when the owner pushes a tag v<major>.<minor>.<patch>.
# verify runs every check with no secrets; publish then waits for the owner's approval (the release
# environment) and uploads to the Central Portal for review. Nothing is published until the owner
# clicks Publish there. See openspec/specs/release-publishing.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# One release run per tag at a time; a second push of the same tag waits rather than cancelling.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history, so the tagged commit can be checked against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -E -x -q 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "Tag $TAG is on main at $GITHUB_SHA"

      # The java that scripts/check-openspec starts the CLI jar with. Mill fetches its own JDK 27.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"

      # ears.js tests and the OpenSpec CLI run on Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.16.0

      - name: Check formatting
        run: ./mill __.checkFormat

      - name: Compile
        run: ./mill __.compile

      - name: Test
        run: ./mill __.test

      - name: Check OpenSpec
        run: scripts/check-openspec

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Requires the owner's approval, and only v* tags may use it; it holds the publishing secrets.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --shouldRelease false uploads for review (USER_MANAGED); Mill's default would publish at once.
      - name: Upload to the Central Portal for review
        env:
          TAG: ${{ github.ref_name }}
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: |
          export EARS_RELEASE_VERSION="${TAG#v}"
          echo "Uploading version $EARS_RELEASE_VERSION for review"
          ./mill mill.javalib.SonatypeCentralPublishModule/publishAll --shouldRelease false
