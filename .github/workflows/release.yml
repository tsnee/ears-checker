# Releases a version to Maven Central, GitHub Releases, and npm when the owner pushes a tag
# v<major>.<minor>.<patch>.
# tag (which also writes the release notes from CHANGELOG.md) and checks (the whole CI workflow)
# run with no secrets; publish then waits for the owner's approval (the release environment) and
# uploads to the Central Portal for review; draft-release then creates a draft GitHub Release with
# the notes and the files the checks passed on; npm then stages the two npm tarballs on npm.
# Nothing is published until the owner publishes the draft, clicks Publish on the Central Portal,
# and approves the staged npm versions, in that order. See openspec/specs/release-publishing,
# openspec/specs/github-release, and openspec/specs/npm-publishing.
# scripts/ci-run-record records only runs of the workflows named "CI" and "Release": renaming this
# one means changing the script too.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# One release run per tag at a time; a second push of the same tag waits rather than cancelling.
# The group name must differ from ci.yml's when it's called from here: that one evaluates to
# "Release-<ref>", and group names are compared without regard to case.
concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, so the tagged commit can be checked against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The format check repeats the trigger's tag filter on purpose: if the filter is ever
      # widened, a tag that isn't a plain version still can't reach publish.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -E -x -q 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          echo "Tag $TAG is on main at $GITHUB_SHA"

      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      # The version's section of CHANGELOG.md, then the description of the release's files. A
      # missing section fails here, before anything is built or uploaded.
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ./mill --ticker false ears.releaseNotes.run notes "${TAG#v}" CHANGELOG.md \
            docs/release-files.md >notes.md
          cat notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  # Every CI check (check and check-jdk17) on the tagged commit, from the same workflow file.
  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [tag, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Requires the owner's approval, and only v* tags may use it; it holds the publishing secrets.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the release version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "EARS_RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # Compile and package everything here, with no secrets in the environment, so build code
      # (compiler plugins, dependencies, scaladoc) never runs next to the signing key.
      - name: Build the release artifacts
        run: ./mill __.publishArtifacts

      # Only signs and uploads: Mill reuses the artifacts the step above built. --shouldRelease
      # false uploads for review (USER_MANAGED); Mill's default would publish at once.
      - name: Upload to the Central Portal for review
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: |
          echo "Uploading version $EARS_RELEASE_VERSION for review"
          ./mill mill.javalib.SonatypeCentralPublishModule/publishAll --shouldRelease false

  # A draft GitHub Release for the tag, once the upload succeeded: the notes, the files the checks
  # passed on (release-* artifacts from checks), SHA256SUMS, and a build-provenance attestation
  # for each. The only job whose token can write to the repository, so it checks out nothing and
  # runs no code from the repository or its dependencies: it downloads this run's files and calls
  # GitHub, with gh (GitHub's own, on the runner) rather than a third-party action. A release
  # already made for the tag fails it untouched; to redo a draft, the owner deletes it and reruns
  # this job.
  draft-release:
    needs: [tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Only the two gh steps get the token in their environment; the actions take it as input.
      - name: Check that the tag has no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | .html_url')
          if [ -n "$found" ]; then
            echo "::error::$TAG already has a release, left as it is: $found"
            exit 1
          fi
          echo "$TAG has no release yet"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: files

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      # Exactly the release's files (any other entry, a directory or link included, fails), then
      # their checksums.
      - name: Write SHA256SUMS
        working-directory: files
        run: |
          version=${TAG#v}
          expected=$(printf '%s\n' "ears-check-$version.jar" "tsnee-ears-checker-$version.tgz" \
            "tsnee-ears-checker-cli-$version.tgz" "ears-check-$version-linux-x64" \
            "ears-check-$version-linux-arm64" "ears-check-$version-macos-arm64" | sort)
          found=$(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::The release's files differ from those expected (< found):"
            diff <(printf '%s\n' "$found") <(printf '%s\n' "$expected") || true
            exit 1
          fi
          sha256sum -- * >../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: files/*

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "${TAG#v}" --notes-file notes/notes.md files/*
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets \
            --jq '{url, isDraft, assets: [.assets[] | {name, size}]}'

  # Stages the two npm tarballs the checks passed on (the ones the draft release attaches) on npm,
  # once the draft exists. Staged versions aren't public: the owner approves them on npm, with a
  # second factor, after publishing the GitHub Release and the Central Portal deployment
  # (scripts/approve-npm-release). npm's trusted publishing authenticates it: the npm environment
  # (v* tags only, no reviewer) is named in each package's trusted publisher, which may only stage,
  # so no npm token is stored anywhere. It runs only the pinned npm from .github/npm, on this run's
  # files. See openspec/specs/npm-publishing.
  npm:
    needs: [tag, draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Only the lockfile of the pinned npm.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/npm
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # npm 11.15.0 or later has npm stage; the lockfile pins the version and its integrity.
      - name: Install the pinned npm
        run: |
          npm ci --prefix .github/npm --ignore-scripts --no-audit --no-fund
          echo "npm $(.github/npm/node_modules/.bin/npm --version)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jvm
          path: files

      # Each tarball must name its package at the tag's version, before either is staged.
      # (draft-release has already checked that the artifacts hold exactly the release's files.)
      - name: Check the npm tarballs
        working-directory: files
        run: |
          version=${TAG#v}
          for pair in "tsnee-ears-checker-$version.tgz @tsnee/ears-checker" \
                      "tsnee-ears-checker-cli-$version.tgz @tsnee/ears-checker-cli"; do
            file=${pair% *}
            name=${pair#* }
            declared=$(tar -xOzf "$file" package/package.json | jq -r '.name + "@" + .version')
            if [ "$declared" != "$name@$version" ]; then
              echo "::error::$file declares $declared, not $name@$version"
              exit 1
            fi
            echo "$file is $declared, SHA-256 $(sha256sum "$file" | cut -d ' ' -f 1)"
          done

      # npm exchanges the job's OIDC token for a short-lived one through the trusted publisher, and
      # adds provenance. The library first, then the command line; each is tried whatever became of
      # the other, so a rerun stages whichever isn't staged yet (one staged by an earlier attempt
      # fails again, since its version is taken, and the step names it).
      - name: Stage the npm packages
        working-directory: files
        run: |
          version=${TAG#v}
          failed=''
          for file in "tsnee-ears-checker-$version.tgz" "tsnee-ears-checker-cli-$version.tgz"; do
            if ../.github/npm/node_modules/.bin/npm stage publish "./$file" --provenance \
                --access public --ignore-scripts; then
              echo "Staged $file"
            else
              echo "::error::Staging $file failed"
              failed="$failed $file"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Not staged by this attempt:$failed"
            exit 1
          fi
