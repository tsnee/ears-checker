# Format, compile, test, and the OpenSpec check, on every push to main and every pull request,
# and on a release tag when release.yml calls it before publishing. Publishes nothing itself. On a
# release tag every job builds at the tag's version, and the files the checks passed on are kept
# as artifacts named release-* for release.yml to attach; any other run keeps none.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

# A newer commit on a pull request cancels its older run; every commit on main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # On a release tag, everything is built at the tag's version.
      - name: Set the release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: echo "EARS_RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # The java that scripts/check-openspec starts the CLI jar with: the newest JDK here, the
      # oldest supported one in check-jdk17. Mill fetches its own JDK 27 for the build.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"

      # The Scala.js tests and the npm package and Node CLI checks run on Node: the newest here, the
      # oldest the packages support in check-jdk17.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Dependencies, Mill's JDK, and the Mill launcher.
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      # cmark, which the native Markdown reader loads when it runs, in the native tests (Scala
      # Native's clang is on the runner already; nothing links cmark). The native CLI's checks are
      # in native.yml.
      - name: Install cmark
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libcmark-dev
          dpkg-query -W 'libcmark*'

      # The OpenSpec CLI, and the TypeScript compiler and linters the npm package check uses,
      # with their whole dependency tree pinned by .github/tools/package-lock.json and no install
      # scripts run: these jobs build files a release attaches.
      - name: Install the npm tools
        run: |
          npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund
          echo "$PWD/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: ./mill __.checkFormat

      - name: Compile
        run: ./mill '__:^ScalaNativeModule.compile'

      # Scala Native 0.5.12's compiler plugin caches its definitions globally with no locking, so
      # two native compiles in Mill's one JVM can corrupt each other's compiler state ("tail of
      # empty list", run 42516759834). Compile them one at a time until a release fixes it:
      # https://github.com/scala-native/scala-native/issues/4950
      - name: Compile Scala Native, one module at a time
        run: ./mill -j 1 '__:ScalaNativeModule.compile'

      - name: Test
        run: ./mill __.test

      # The changelog's form: Unreleased, then each release, newest first.
      - name: Check the changelog
        run: ./mill ears.releaseNotes.run check CHANGELOG.md

      # Each check keeps the files it passed on in kept/, logging their SHA-256.
      - name: Check the npm package
        run: scripts/check-npm-package --out kept

      # The Node CLI, installed from its packed package, against the JVM jar on the same inputs.
      - name: Check the Node CLI
        run: scripts/check-npm-cli --out kept

      # On a release tag, the jar and both tarballs, as checked, for the release.
      - name: Name the jar for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv kept/ears-check.jar "kept/ears-check-$EARS_RELEASE_VERSION.jar"
          ls -l kept

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jvm
          path: kept/
          if-no-files-found: error

      # scala-cli links the Scala.js library's link-check program against the published artifact;
      # it uses the runner's Java from setup-java.
      - uses: VirtusLab/scala-cli-setup@3f5bf11a33bb88343238780c18257c8fa43789e1 # v1.18.0
        with:
          scala-cli-version: "1.18.0"

      - name: Check the Scala.js library
        run: scripts/check-scalajs-link

      # Each module's percentages on the run's summary page, from Mill's own report (it logs to
      # standard error). Before the check, so the summary is written even when the check fails.
      # Every module gets its section; a failed report says so there, and fails the step at the end.
      - name: Report coverage
        run: |
          failed=0
          fence="\`\`\`"
          for module in ears ears.cli ears.npm ears.linkCheck ears.markdown ears.releaseNotes; do
            if report="$(./mill --ticker false "$module.scoverage.consoleReport" 2>&1)"; then
              lines="$(printf '%s\n' "$report" | grep -E '^(Statement|Branch) coverage' || true)"
            else
              printf '%s\n' "$report"
              lines=""
            fi
            if [ -z "$lines" ]; then
              lines="The coverage report failed; see this step's log."
              failed=1
            fi
            printf '### Coverage of %s\n\n%s\n%s\n%s\n\n' "\`$module\`" "$fence" "$lines" "$fence" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

      # The minimums are statementCoverageMin and branchCoverageMin in build.mill.
      - name: Check coverage
        run: >-
          ./mill ears.scoverage.validateCoverageMinimums
          + ears.cli.scoverage.validateCoverageMinimums
          + ears.npm.scoverage.validateCoverageMinimums
          + ears.linkCheck.scoverage.validateCoverageMinimums
          + ears.markdown.scoverage.validateCoverageMinimums
          + ears.releaseNotes.scoverage.validateCoverageMinimums

      - name: Check OpenSpec
        run: scripts/check-openspec

  # The native binary for each released platform, built and checked on its oldest runner and
  # checked again on its newest.
  native:
    uses: ./.github/workflows/native.yml

  # The oldest supported runtimes: the OpenSpec check again with JDK 17, the oldest JDK the jar
  # supports, starting it; and the npm package and Node CLI checks on Node 22, the oldest Node the
  # packages declare (the CLI check runs the jar on JDK 17 too). The tests stay in check: Mill
  # runs them on its own JDK, not the runner's. The job keeps its name so branch protection that
  # names it keeps working.
  check-jdk17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: echo "EARS_RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # The oldest Node the npm package declares (engines), which the OpenSpec CLI also supports.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Install the npm tools
        run: |
          npm ci --prefix .github/tools --ignore-scripts --no-audit --no-fund
          echo "$PWD/.github/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check OpenSpec
        run: scripts/check-openspec

      - name: Check the npm package
        run: scripts/check-npm-package

      - name: Check the Node CLI
        run: scripts/check-npm-cli
