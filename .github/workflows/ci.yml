# Format, compile, test, and the OpenSpec check, on every push to main and every pull request,
# and on a release tag when release.yml calls it before publishing. Publishes nothing itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

# A newer commit on a pull request cancels its older run; every commit on main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The java that scripts/check-openspec starts the CLI jar with: the newest JDK here, the
      # oldest supported one in check-jdk17. Mill fetches its own JDK 27 for the build.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"

      # The Scala.js tests and the npm package and Node CLI checks run on Node: the newest here, the
      # oldest the packages support in check-jdk17.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # Dependencies, Mill's JDK, and the Mill launcher.
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      # cmark, which the native Markdown reader loads when it runs, in the native tests and the
      # native CLI check (Scala Native's clang is on the runner already; nothing links cmark).
      - name: Install cmark
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libcmark-dev
          dpkg-query -W 'libcmark*'

      # The OpenSpec CLI, and the TypeScript compiler and linters the npm package check uses.
      - name: Install the npm tools
        run: >-
          npm install -g @fission-ai/openspec@1.16.0 typescript@7.0.2 publint@0.3.25
          @arethetypeswrong/cli@0.18.5

      - name: Check formatting
        run: ./mill __.checkFormat

      - name: Compile
        run: ./mill __.compile

      - name: Test
        run: ./mill __.test

      - name: Check the npm package
        run: scripts/check-npm-package

      # The Node CLI, installed from its packed package, against the JVM jar on the same inputs.
      - name: Check the Node CLI
        run: scripts/check-npm-cli

      # The native binary, against the JVM jar on the same inputs; and that it links no cmark.
      - name: Check the native CLI
        run: scripts/check-native-cli

      # scala-cli links the Scala.js library's link-check program against the published artifact;
      # it uses the runner's Java from setup-java.
      - uses: VirtusLab/scala-cli-setup@3f5bf11a33bb88343238780c18257c8fa43789e1 # v1.18.0
        with:
          scala-cli-version: "1.18.0"

      - name: Check the Scala.js library
        run: scripts/check-scalajs-link

      # Each module's percentages on the run's summary page, from Mill's own report (it logs to
      # standard error). Before the check, so the summary is written even when the check fails.
      # Every module gets its section; a failed report says so there, and fails the step at the end.
      - name: Report coverage
        run: |
          failed=0
          fence="\`\`\`"
          for module in ears ears.cli ears.npm ears.linkCheck ears.markdown; do
            if report="$(./mill --ticker false "$module.scoverage.consoleReport" 2>&1)"; then
              lines="$(printf '%s\n' "$report" | grep -E '^(Statement|Branch) coverage' || true)"
            else
              printf '%s\n' "$report"
              lines=""
            fi
            if [ -z "$lines" ]; then
              lines="The coverage report failed; see this step's log."
              failed=1
            fi
            printf '### Coverage of %s\n\n%s\n%s\n%s\n\n' "\`$module\`" "$fence" "$lines" "$fence" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

      # The minimums are statementCoverageMin and branchCoverageMin in build.mill.
      - name: Check coverage
        run: >-
          ./mill ears.scoverage.validateCoverageMinimums
          + ears.cli.scoverage.validateCoverageMinimums
          + ears.npm.scoverage.validateCoverageMinimums
          + ears.linkCheck.scoverage.validateCoverageMinimums
          + ears.markdown.scoverage.validateCoverageMinimums

      - name: Check OpenSpec
        run: scripts/check-openspec

      # Last, since it removes cmark from the runner. With only the runtime package, which has
      # just a versioned libcmark.so.*, the native binary still reads Markdown; with no cmark, it
      # says what to install, and plain text still works. It also shows what the binary does
      # with a non-ASCII file name under the C locale (printed, not checked).
      - name: Check the native binary with less cmark
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          # Every directory CmarkLibrary searches on Linux.
          searched=(/usr/lib/x86_64-linux-gnu /usr/lib/aarch64-linux-gnu /usr/lib64 /usr/lib
            /usr/local/lib)
          libraries() { find "${searched[@]}" -maxdepth 1 -name 'libcmark.so*' 2>/dev/null || true; }
          shown=$(./mill --ticker false show ears.cli.native.nativeLink)
          binary=$(printf '%s' "$shown" | jq -r 'if type == "object" then .path else . end |
            sub("^ref:v[0-9]+:[0-9a-f]+:"; "")')
          [ -x "$binary" ] || fail "Mill printed no usable binary: $binary"
          dir=$(mktemp -d)
          printf '%s\n' '- When an order arrives the scheduler shall list events.' >"$dir/notes.md"
          printf '%s\n' 'The scheduler lists events.' >"$dir/notes.txt"
          run() {
            status=0
            "$binary" "$@" >"$dir/out" 2>&1 || status=$?
            cat "$dir/out"
          }
          runtime=$(dpkg-query -W -f '${Package}\n' 'libcmark0*')
          sudo apt-get remove -y -q libcmark-dev
          if libraries | grep -q -E '/libcmark\.so$'; then
            fail "an unversioned libcmark.so is still installed: $(libraries)"
          fi
          run --verbose "$dir/notes.md"
          if [ "$status" != 1 ] || ! grep -q missing-comma "$dir/out" ||
            ! grep -q 'parser="cmark 0\.' "$dir/out"; then
            fail "with only $runtime, Markdown wasn't read through it (status $status)"
          fi
          sudo apt-get remove -y -q "$runtime"
          if [ -n "$(libraries)" ] || ldconfig -p | grep -q libcmark; then
            fail "a cmark library is still installed: $(libraries)"
          fi
          run "$dir/notes.md"
          if [ "$status" != 2 ] || ! grep -q "brew install cmark" "$dir/out" ||
            ! grep -q "apt install libcmark0.30.0" "$dir/out" ||
            ! grep -q "attempts=" "$dir/out"; then
            fail "without cmark, Markdown didn't fail with the message (status $status)"
          fi
          run "$dir/notes.txt"
          if [ "$status" != 1 ] || ! grep -q missing-modal "$dir/out"; then
            fail "without cmark, plain text wasn't checked as usual (status $status)"
          fi
          name=$(printf 'r\303\251sum\303\251.txt')
          cp "$dir/notes.txt" "$dir/$name"
          (cd "$dir" && LC_ALL=C LANG=C "$binary" "$name") || true

  # The oldest supported runtimes: the OpenSpec check again with JDK 17, the oldest JDK the jar
  # supports, starting it; and the npm package and Node CLI checks on Node 22, the oldest Node the
  # packages declare (the CLI check runs the jar on JDK 17 too). The tests stay in check: Mill
  # runs them on its own JDK, not the runner's. The job keeps its name so branch protection that
  # names it keeps working.
  check-jdk17:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # The oldest Node the npm package declares (engines), which the OpenSpec CLI also supports.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Install the npm tools
        run: >-
          npm install -g @fission-ai/openspec@1.16.0 typescript@7.0.2 publint@0.3.25
          @arethetypeswrong/cli@0.18.5

      - name: Check OpenSpec
        run: scripts/check-openspec

      - name: Check the npm package
        run: scripts/check-npm-package

      - name: Check the Node CLI
        run: scripts/check-npm-cli
